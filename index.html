.steps .on{color:var(--green);font-weight:600}

.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--chip);padding:0 14px;color:var(--muted);margin:0 0 12px}

.fab{position:absolute;right:18px;bottom:calc(86px + var(--sb));height:52px;border-radius:26px;background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-weight:600;font-size:16px;box-shadow:0 8px 20px rgba(28,77,58,.35);z-index:15}
.selbar{position:absolute;left:0;right:0;bottom:calc(66px + var(--sb));padding:12px 20px;background:linear-gradient(to top,var(--bg) 70%,rgba(250,248,244,0));z-index:16}
.sw{display:flex;flex-wrap:wrap;gap:10px}

 {id:'pants',name:'Pantalón crema',short:'Pantalón',slot:'abajo',color:'crema',crop:[753,754,536]},

/* ---------- estado ---------- */
let S;const timers=[];let upTimer=null;

 screen:'intro',introIdx:0,stack:[],agree:{age:false,priv:false},email:'',errs:{},busy:false,

 armarMode:'sugerir',occasion:'Trabajo',conjSel:new Set(['c1','c2']),pick:new Set(),prio:true,

 conjs:[],gen:null,group:'conjunto',showFavs:false,favs:new Set(),install:true,badge:false,
 detail:null,coachLooks:false,coachDetail:false,fromTab:false
},keep||{})}
const TOG={offline:false,failOne:false,photoErr:false};
S=fresh();

/* ---------- utilidades de interfaz ---------- */

 t.innerHTML=it.map(([id,l,i])=>id==='armar'?`<button class="tab armar" data-act="tab" data-t="armar" aria-label="Armar"><span class="pill">${ic('hanger',26)}<span>Armar</span></span></button>`

/* ---------- navegación ---------- */
function go(id,o={}){const{replace,...rest}=o;if(!replace&&S.screen!==id)S.stack.push(S.screen);if(id!=='subiendo'){clearInterval(upTimer)}S.screen=id;Object.assign(S,rest);render()}
function back(){const p=S.stack.pop();S.screen=p||'armario';render()}

 const keep=[...screenEl.querySelectorAll('[data-sc]')].map(e=>[e.dataset.sc,e.scrollTop,e.scrollLeft]);const prev=screenEl.dataset.v;
 const v=VIEWS[S.screen]();screenEl.innerHTML=v.html;screenEl.dataset.v=S.screen;
 if(prev===S.screen)keep.forEach(([k,t,l])=>{const e=screenEl.querySelector(`[data-sc="${k}"]`);if(e){e.scrollTop=t;e.scrollLeft=l}});
 setTab(v.tab);$('#status').classList.toggle('dk',!!v.dark);app.classList.toggle('off',TOG.offline);
 v.after&&v.after()}

/* ---------- pantallas ---------- */

/* Onboarding 1: intro */
const INTRO=[

 {t:'Mírate con tus outfits.',d:'Elige prendas, cuenta dónde quieres verte y creamos fotos de ti. Siempre en vertical, estilo Pinterest.',
  vis:()=>`<div style="position:relative;width:100%;height:100%"><div class="lk ph" style="position:absolute;left:4%;top:18px;width:46%;transform:rotate(-4deg);box-shadow:0 12px 28px rgba(0,0,0,.2);background-image:${imgv('c1_terraza')}"><span class="tt">Terraza al atardecer</span></div><div class="lk ph" style="position:absolute;right:2%;top:50px;width:50%;transform:rotate(3deg);box-shadow:0 12px 28px rgba(0,0,0,.22);background-image:${imgv('c1_oficina')}"><span class="tt">Oficina luminosa</span></div></div>`},
 {t:'Cambia la escena platicando.',d:'Dile al agente «hazlo de noche» y listo. Con tu foto, además, descubrimos qué colores te favorecen.',
  vis:()=>`<div style="width:100%"><div class="card" style="padding:14px"><div class="msg"><div class="bub u">Que sea de noche y esté lloviendo</div></div><div class="msg"><span class="av">${ic('sparkle',18)}</span><div class="bub a">Listo: la misma calle, de noche y con lluvia. Creé una versión nueva.</div></div></div><div class="card" style="margin-top:12px;display:flex;align-items:center;gap:12px"><div class="sw" style="gap:6px;flex-wrap:nowrap">${PAL.fav.slice(0,5).map(c=>`<i style="width:28px;height:28px;border-radius:50%;background:${c[0]};display:block"></i>`).join('')}</div><span style="font-size:14px"><b>Tu paleta</b><br><span class="sm">Otoño suave</span></span></div></div>`}

/* Onboarding 2: cuenta */
VIEWS.cuenta=()=>{const e=S.errs;
 return{html:`<div class="scr">${topbar({back:'back'})}<div class="body nb">
 <h1 class="t">Crea tu cuenta</h1><p class="sub">Guarda tu armario y tus looks. Solo tú los ves.</p>
 <button class="btn sec ${S.busy?'load':''}" data-act="google" style="margin-bottom:14px"><b style="font-size:20px;font-family:Georgia">G</b> Continuar con Google</button>
 <div style="text-align:center;color:var(--muted);font-size:14px;margin:0 0 12px">o con tu correo</div>

VIEWS.primeras=()=>({html:`<div class="scr">${topbar({back:'back'})}<div class="body nb">${stepsHTML(1)}
 <h1 class="t">Empecemos por tu ropa.</h1>

/* Reconocimiento */
function startUpload(){clearInterval(upTimer);S.up={phase:'up',n:0,paused:false};
 upTimer=setInterval(()=>{if(S.screen!=='subiendo'){clearInterval(upTimer);return}
  if(TOG.offline){S.up.paused=true;render();return}S.up.paused=false;S.up.n++;

  else if(S.up.phase==='rec'&&S.up.n>6){clearInterval(upTimer);S.added=true;go('revisar',{replace:true});return}
  render()},700);render()}
VIEWS.subiendo=()=>{const u=S.up||{phase:'up',n:0},up=u.phase==='up',n=Math.min(u.n,6);

 </div>${cta(`<button class="btn" data-act="saveGarments">Todo bien, guardar 6 prendas</button>`)}</div>`}};

 return{tab:'armario',html:`<div class="scr"><div class="top" style="padding:0 20px"><h1 class="t" style="margin:0">Armario</h1><button class="btn ghost" data-act="selMode" style="width:auto;padding:0 4px;height:44px">${S.selMode?'Cancelar':'Seleccionar'}</button></div>

 </div>

/* Tu paleta */
VIEWS.paleta=()=>{
 if(S.palState!=='done')return{html:`<div class="scr">${topbar({})}<div class="body nb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="ph" style="width:132px;height:132px;border-radius:50%;background-image:${imgv('base')};background-size:260% auto;background-position:48% 5.5%"></div><h2 class="t" style="margin-top:20px">Mirando tus colores…</h2><div class="sw" style="justify-content:center;margin-top:10px;gap:8px">${PAL.fav.slice(0,6).map((c,i)=>`<i style="width:30px;height:30px;border-radius:50%;background:${c[0]};display:block;animation:sh 1.2s ${i*.15}s infinite alternate;opacity:.9"></i>`).join('')}</div></div></div>`};

 <div class="card pc"><b>Te favorecen</b><div style="height:10px"></div>${sw(PAL.fav)}</div>
 <div class="card pc"><b>Neutros que te van</b><div style="height:10px"></div>${sw(PAL.neu)}</div>
 <div class="card pc"><b>Mejor lejos de la cara</b><div style="height:10px"></div>${sw(PAL.away,'dim')}</div>
 <div style="display:flex;align-items:center;gap:10px;margin:2px 0 10px"><i style="width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1d37c,#b98b2a);display:block"></i><span>Dorado</span></div>

/* Armar paso 1 */
function pickConjs(){
 if(S.armarMode==='sugerir'){return{conjs:['c1','c2'].filter(c=>S.conjSel.has(c)&&S.occasion!=='Deporte'),msg:'Elige al menos un conjunto.'}}
 const p=S.pick;if(!p.has('tee'))return{conjs:[],msg:'Todavía no hay con qué armar un outfit. Te falta una prenda de arriba.'};
 const c=[];if(p.has('jeans'))c.push('c1');if(p.has('pants'))c.push('c2');
 return c.length?{conjs:c}:{conjs:[],msg:'Todavía no hay con qué armar un outfit. Te falta una prenda de abajo.'}}
VIEWS.armar1=()=>{const pc=pickConjs(),n=pc.conjs.length;
 const suger=()=>S.occasion==='Deporte'?`<div class="sp">${ic('info',18)}<span>Con lo que hay en tu armario no salen conjuntos para Deporte. Sube más ropa o prueba otra ocasión.</span></div>`:['c1','c2'].map(id=>{const c=CONJ[id],on=S.conjSel.has(id);
  return`<button class="ocr ${on?'on':''}" data-act="conjTog" data-c="${id}"><div class="mini">${c.items.map(i=>tile(GB[i])).join('')}</div><div class="meta"><b>Conjunto ${c.n}</b><span class="sm">Blazer, playera, ${id==='c1'?'jeans':'pantalón crema'} y mocasines</span>${S.hasPalette&&S.prio?`<div style="margin-top:6px"><span class="mark y">${ic('check',12)}Te favorece</span></div>`:''}</div><span class="cb ${on?'on':''}" style="width:auto;padding:0"><i>${ic('check',16)}</i></span></button>`}).join('');
 return{html:`<div class="scr"><div class="top"><button class="ib g" data-act="armarBack" aria-label="Volver">${ic('back')}</button><span class="ttl">Paso 1 de 2</span><button class="ib" data-act="armarClose" aria-label="Salir">${ic('close')}</button></div>
 <div class="body" data-sc="a1"><h2 class="t" style="margin-bottom:12px">¿Con qué prendas?</h2>
 <div class="seg" style="margin-bottom:16px"><button class="${S.armarMode==='elegir'?'on':''}" data-act="mode" data-v="elegir">Elegir yo</button><button class="${S.armarMode==='sugerir'?'on':''}" data-act="mode" data-v="sugerir">Sugerir</button></div>
 ${S.armarMode==='sugerir'?`<div class="chips scx" style="margin-bottom:14px">${['Trabajo','Casual','Salida','Deporte','Evento'].map(o=>`<button class="chip ${S.occasion===o?'on':''}" data-act="occ" data-v="${o}">${o}</button>`).join('')}</div>
  ${S.hasPalette?`<div class="ban" style="display:flex;align-items:center;gap:12px;padding:12px 16px"><div style="flex:1"><b>Priorizar mis colores</b><div class="sm">Ordenamos los conjuntos por cuánto te favorecen.</div></div><button class="sw2 ${S.prio?'on':''}" data-act="prio" role="switch" aria-checked="${S.prio}" aria-label="Priorizar mis colores"></button></div>`:`<div class="sp">${ic('pal',18)}<span>Sugerimos con lo que hay, sin tus colores. <button data-act="toast" data-m="Aquí se abre Tu foto." style="color:var(--green);font-weight:600;text-decoration:underline">Subir mi foto</button> y analizamos cuáles te favorecen.</span></div>`}
  ${suger()}`
 :`<div class="grid2">${G.map(g=>{const on=S.pick.has(g.id);return`<button class="gi ${on?'on':''}" data-act="pick" data-g="${g.id}">${tile(g)}<span class="sel">${on?ic('check',16):''}</span><div class="nm">${g.name}</div>${g.id==='vest'&&!S.vestOK?'<span class="badge">Por revisar</span>':''}</button>`}).join('')}</div>
  ${n===0?`<div class="sp" style="margin-top:14px">${ic('info',18)}<span>${pc.msg}</span></div>`:''}`}
 </div>${cta(`<button class="btn ${n?'':'off'}" data-act="a1next">Siguiente${n?` · ${plural(n,'conjunto','conjuntos')}`:''}</button>`)}</div>`}};

/* Armar paso 2 */
const WARN_CLOTHES=/vestido|camisa|pantal|falda|playera|blazer|zapat|ropa|chamarra|suéter|sueter/i,WARN_FMT=/horizontal|cuadrad|panor|landscape/i;
function sceneWarn(t){return WARN_FMT.test(t)?'Todas las fotos salen en vertical. Describe solo el lugar.':WARN_CLOTHES.test(t)?'La ropa sale de tu armario. Aquí describe solo el lugar.':''}
function sumText(){const c=S.conjs.length,s=S.scenes.length;return`${plural(c,'conjunto','conjuntos')} × ${plural(s,'escena','escenas')} = ${plural(c*s,'imagen','imágenes')}`}
VIEWS.armar2=()=>{const tot=S.conjs.length*S.scenes.length,over=tot>12;
 return{html:`<div class="scr"><div class="top"><button class="ib g" data-act="back" aria-label="Volver">${ic('back')}</button><span class="ttl">Paso 2 de 2</span><button class="ib" data-act="armarClose" aria-label="Salir">${ic('close')}</button></div>
 <div class="body" data-sc="a2" style="padding-bottom:190px"><h2 class="t" style="text-align:center;font-size:27px">¿Dónde quieres verte?</h2><p class="sub" style="text-align:center">Cuéntalo como se lo contarías a una amiga: lugar, hora, ambiente.</p>
 ${S.scenes.map((s,i)=>`<div style="margin:0 0 12px"><div style="position:relative"><textarea class="ta" data-scene="${i}" maxlength="280" placeholder="Cena en una terraza al atardecer" aria-label="Escena ${i+1}">${esc(s.text)}</textarea><span class="cnt" id="cnt${i}">${s.text.length}/280</span></div><div class="err" id="w${i}" style="${sceneWarn(s.text)?'':'display:none'};margin:4px 4px 0">${ic('info',18)}<span>${sceneWarn(s.text)}</span></div></div>`).join('')}
 ${S.scenes.length<3?`<button class="btn ghost" data-act="addScene" style="justify-content:flex-start;width:auto;padding:0 4px">${ic('plus',22)} Agregar otra escena</button>`:`<p class="sm" style="margin:0 0 6px">En el prototipo hay fotos para 3 escenas (en la app, hasta 4).</p>`}
 <div class="sm" style="margin:10px 0 8px;font-size:15px">Ideas para inspirarte</div><div class="chips">${['Oficina luminosa','Cafetería','Calle al atardecer','Playa','Fiesta de noche'].map(c=>`<button class="chip ol" data-act="idea" data-v="${c}">${c}</button>`).join('')}</div>
 <p class="sm" style="margin:14px 0 0;display:flex;gap:8px;align-items:center">${ic('info',18)}Todas tus fotos salen en vertical, estilo Pinterest.</p>
 <p class="sm" style="margin:8px 0 0;padding-left:26px">Si no escribes nada, usamos un fondo de estudio liso.</p></div>
 ${cta(`<div class="sum" id="sum" style="margin-bottom:10px;${over?'background:#fbe9dc;color:#a24610;font-size:15px;line-height:1.3':''}">${over?'Máximo 12 imágenes por tanda. Baja los conjuntos o las escenas.':ic('hanger',22)+sumText()}</div><button class="btn ${over?'off':''}" id="a2btn" data-act="a2go">Armar outfits</button>`)}</div>`}};

/* Looks */
function readyAll(){S.conjs=S.conjs.length?S.conjs:['c1','c2'];const items=[];S.conjs.forEach(c=>S.scenes.forEach((_,si)=>items.push(c+':'+si)));S.gen={total:items.length,items,ready:new Set(items),failed:new Set(),dropped:new Set(),done:true,cancelled:false}}
function startGen(){timers.splice(0).forEach(clearTimeout);const items=[];S.conjs.forEach(c=>S.scenes.forEach((_,si)=>items.push(c+':'+si)));
 const g=S.gen={total:items.length,items,ready:new Set(),failed:new Set(),dropped:new Set(),done:false,cancelled:false};
 items.forEach((k,i)=>timers.push(setTimeout(()=>{if(S.gen!==g||g.cancelled)return;if(TOG.failOne&&i===1)g.failed.add(k);else g.ready.add(k);genCheck()},1500+i*1300)))}
function genCheck(){const g=S.gen;if(!g)return;if(g.ready.size+g.failed.size>=g.total&&!g.done&&!g.failed.size){g.done=true;toast(`Listo: ${plural(g.total,'look','looks')}.`);if(S.screen==='looks'&&!S.coachSeen){S.coachLooks=true;S.coachSeen=true}}
 else if(g.ready.size+g.failed.size>=g.total&&g.failed.size){/* espera el reintento */}
 if(S.screen==='looks')render();else if(S.screen!=='looks'){S.badge=true;setTab(S.screen==='armario'?'armario':S.screen==='yo'?'yo':null)}}
function kText(k){const[c,si]=k.split(':');return{c,si:+si}}
VIEWS.looks=()=>{const g=S.gen;
 if(!g)return{tab:'looks',html:`<div class="scr"><div class="top" style="padding:0 20px"><h1 class="t" style="margin:0">Looks</h1></div><div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${ic('shirt',56)}<h2 class="t" style="margin-top:14px">Aquí verás tus outfits.</h2><p class="sub">Elige prendas y arma tu primera tanda.</p><button class="btn" style="max-width:300px" data-act="tab" data-t="armar">Armar mi primer outfit</button></div></div>`};
 const card=(c,si,mode)=>{const k=c+':'+si;if(g.dropped.has(k))return'';if(S.showFavs&&!S.favs.has(k))return'';
  const st=g.ready.has(k)?'r':g.failed.has(k)?'f':'w',title=S.scenes[si].title;
  if(st==='w')return`<div class="lk sk"><i class="sk-i">${ic('sparkle',26)}</i><span>Creando…</span></div>`;
  if(st==='f')return`<div class="lk sk" style="animation:none;background:#efe9de"><span style="font-weight:600;color:#6b3b2a">No salió</span><button class="btn sec sm2" style="width:auto;padding:0 18px;height:40px" data-act="retry" data-k="${k}">Reintentar</button></div>`;
  return`<div class="lk ph" data-act="open" data-k="${k}" style="background-image:${imgv(lookKey(c,si))}" role="img" aria-label="${mode==='c'?title:CONJ[c].name}"><span class="tt">${mode==='c'?esc(title):CONJ[c].name}</span><button class="hrt ${S.favs.has(k)?'on':''}" data-act="fav" data-k="${k}" aria-label="Favorito">${ic('heart',26)}</button></div>`};
 const strip=c=>`<div class="strip">${CONJ[c].items.map(i=>`<div class="tg">${tile(GB[i])}${S.hasPalette&&marksOn(GB[i])?'<i class="dot"></i>':''}</div>`).join('')}</div>`;
 const secs=S.group==='conjunto'?S.conjs.map(c=>{const cards=S.scenes.map((_,si)=>card(c,si,'c')).join('');return cards.trim()?`<section class="conj"><div class="conj-h">${strip(c)}<button class="ib" data-act="toast" data-m="Aquí: Quitar conjunto · Probar con otra escena" aria-label="Más opciones">${ic('more')}</button></div><div class="car" data-sc="car-${c}">${cards}</div></section>`:''}).join('')
 :S.scenes.map((s,si)=>{const cards=S.conjs.map(c=>card(c,si,'s')).join('');return cards.trim()?`<section class="conj"><div class="conj-h"><div style="flex:1"><b style="font-size:18px;font-family:var(--serif)">${esc(s.title)}</b><div class="sm">${esc(s.text.slice(0,48))}${s.text.length>48?'…':''}</div></div><button class="ib" data-act="toast" data-m="Aquí: Probar esta escena con otro conjunto" aria-label="Más opciones">${ic('more')}</button></div><div class="car" data-sc="car-s${si}">${cards}</div></section>`:''}).join('');
 const gen=!g.done&&!g.cancelled,nF=g.failed.size,nR=g.ready.size;
 return{tab:'looks',html:`<div class="scr"><div class="top" style="padding:0 20px"><h1 class="t" style="margin:0">Looks</h1></div>
 <div class="body" data-sc="lk" style="padding-bottom:140px"><div class="seg" style="margin-bottom:8px"><button class="${!S.showFavs?'on':''}" data-act="seg" data-k="showFavs" data-v="0">Todos</button><button class="${S.showFavs?'on':''}" data-act="seg" data-k="showFavs" data-v="1">Favoritos</button></div>

 <p class="sm" style="margin:6px 0 0;display:flex;gap:8px">${ic('info',16)}<span>Prototipo: las fotos son de ejemplo y no cambian con tu texto.</span></p></div>
 ${S.coachLooks?`<div class="coach up" style="top:calc(var(--st) + 140px)">Desliza para ver el mismo conjunto en otras escenas.<button data-act="coachLooks">Entendido</button></div>`:''}</div>`}};

function dImgKey(){const d=S.detail,v=d.vers[d.vIdx];return v.key}
VIEWS.detalle=()=>{const d=S.detail,keys=dKeys(),k=d.cid+':'+d.si,chat=d.chat,fav=S.favs.has(k),title=S.scenes[d.si].title;
 const photo=`<div class="dimg swipe ph" data-swipe="dnav" id="dimg" style="width:${chat?'var(--iw)':'100%'};background-image:${imgv(dImgKey())}" role="img" aria-label="Look: ${esc(title)}">${!chat&&keys.length>1?`<div class="pg">${keys.map(x=>`<i class="${x===k?'on':''}"></i>`).join('')}</div>`:''}<span class="tt" style="position:absolute;left:12px;bottom:14px;background:#fff;border-radius:12px;padding:6px 10px;font-size:13.5px;max-width:60%;box-shadow:0 2px 8px rgba(0,0,0,.16)">${esc(title)}</span></div>
 <div class="dfl"><button class="fb ${fav?'on':''}" data-act="fav" data-k="${k}" aria-label="Favorito">${ic('heart',24)}</button><button class="fb" data-act="save" aria-label="Guardar">${ic('download',24)}</button><button class="fb" data-act="shareLook" aria-label="Compartir">${ic('share',24)}</button></div>`;
 const vers=`<div style="display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px">${d.vers.map((v,i)=>`<button class="vth ${i===d.vIdx?'on':''}" data-act="ver" data-i="${i}"><div class="ph" style="background-image:${imgv(v.key)}"></div>${v.label}</button>`).join('')}</div>`;
 if(!chat)return{html:`<div class="scr chat0" style="padding-top:0"><div class="body nb" data-sc="det" style="padding:0 0 130px"><div style="height:calc(var(--st) + var(--off))"></div>${topbar({back:'back',right:`<button class="ib" data-act="dmenu" aria-label="Más opciones">${ic('more')}</button>`})}
  <div class="dstage" style="margin-top:2px">${photo}</div>
  <div style="padding:14px 20px 0"><div class="sm" style="margin:0 0 6px;font-weight:600;color:var(--ink)">Versiones</div>${vers}
  <div class="sm" style="margin:12px 0 8px;font-weight:600;color:var(--ink)">Prendas en este look</div><div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px">${CONJ[d.cid].items.map(i=>{const g=GB[i];return`<div style="flex:none;width:84px">${tile(g)}<div style="font-size:12px;margin:5px 0 3px;line-height:1.2">${g.short}</div>${marksOn(g)?`<span class="mark ${g.mark[0]}" style="font-size:11px;padding:2px 6px">${g.mark[1]}</span>`:''}</div>`}).join('')}</div></div></div>
  ${cta(`<button class="btn" data-act="chatOpen">${ic('sparkle',22)} Cambiar escena</button>`)}
  ${S.coachDetail?`<div class="coach up" style="bottom:calc(98px + var(--sb))">Toca «Cambiar escena» para platicar con el agente y cambiar el lugar, la hora o la luz.<button data-act="coachDetail">Entendido</button></div>`:''}</div>`};
 const msgs=d.msgs.map(m=>m.r==='u'?`<div class="msg"><div class="bub u">${esc(m.t)}</div></div>`:`<div class="msg"><span class="av">${ic('sparkle',18)}</span><div class="bub a">${m.t}</div></div>`).join('');
 const chips=d.busy?[]:(d.chips||['Hazlo de noche','Cambia el lugar','Más luz','Más cerca']);
 return{html:`<div class="scr chat" style="padding-top:0;--iw:200px" id="dscr"><div style="height:calc(var(--st) + var(--off))"></div>${topbar({back:'back',right:`<button class="ib" data-act="dmenu" aria-label="Más opciones">${ic('more')}</button>`})}
  <div class="dstage" id="dst" style="margin-top:2px">${photo}</div>
  <div class="csheet" id="csh" style="height:var(--ch,54%)"><i class="grab" style="margin-bottom:8px"></i>${vers}
  ${msgs?'':'<h3 style="font-family:var(--serif);font-size:22px;margin:0 0 6px">Cambia la escena</h3>'}
  <div class="msgs" id="msgs" data-sc="msgs">${msgs||`<div class="msg"><span class="av">${ic('sparkle',18)}</span><div class="bub a">¿Qué quieres cambiar de la escena?</div></div>`}${d.busy?`<div class="msg"><span class="av">${ic('sparkle',18)}</span><div class="bub a" style="color:var(--muted)">Creando la versión ${d.vers.length+1}… suele tardar unos segundos.</div></div>`:''}</div>
  <div class="chips scx" style="margin:6px -16px 0;padding:0 16px">${chips.map(c=>`<button class="chip ol" data-act="chip" data-v="${esc(c)}">${c}</button>`).join('')}</div>
  <div class="sm" style="margin:6px 2px 0;font-size:12.5px">Cada cambio crea 1 imagen nueva.</div>
  <form class="inbar" data-act="chatSend" onsubmit="return false"><input id="cin" placeholder="Cuéntame qué cambiar" aria-label="Mensaje" ${d.busy?'disabled':''} autocomplete="off"><button type="submit" class="send ${d.busy?'':''}" data-act="chatSend" aria-label="Enviar" ${d.busy?'disabled style="opacity:.5"':''}>${ic('send',22)}</button></form></div></div>`,
  after(){layoutChat()}}};
function layoutChat(){const sc=$('#dscr');if(!sc)return;const H=app.clientHeight,st=parseFloat(getComputedStyle(sc).getPropertyValue('--st'))||0;
 const sheetH=Math.round(H*.54),topH=(parseFloat(getComputedStyle(document.body).getPropertyValue('--st'))||0)+(app.classList.contains('off')?30:0)+52+2;const avail=H-sheetH-topH-14;
 sc.style.setProperty('--iw',Math.round(avail/1.5)+'px');sc.style.setProperty('--ch',sheetH+'px');const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}

VIEWS.yo=()=>({tab:'yo',html:`<div class="scr"><div class="top" style="padding:0 20px"><h1 class="t" style="margin:0">Yo</h1></div><div class="body" data-sc="yo">
 <div style="display:flex;align-items:center;gap:14px;margin:0 0 14px"><div class="ph" style="width:72px;height:72px;border-radius:50%;background-image:${imgv('base')};background-size:260% auto;background-position:48% 5.5%"></div><div><b style="font-size:19px">Tú</b><div class="sm">${esc(S.email)||'tucorreo@ejemplo.com'}</div></div></div>

 const g=GB[id];sheet(`<div style="display:flex;gap:16px;align-items:center;margin-bottom:12px"><div style="width:120px;flex:none">${tile(g)}</div><div><h3 style="margin:0 0 6px">${id==='vest'&&S.vestOK?S.vestType:g.name}</h3><div class="chips"><span class="chip" style="height:30px;font-size:13px">${g.slot}</span><span class="chip" style="height:30px;font-size:13px">${g.color}</span></div></div></div>

A.ver=el=>{S.detail.vIdx=+el.dataset.i;render()};
A.chatOpen=()=>{S.coachDetail=false;S.detail.chat=true;render()};
A.dmenu=()=>sheet(`${[['swap','Cambiar una prenda','Elige otra del armario y creamos el conjunto nuevo.'],['flag','No se parece','La prenda, el color o tu cara se ven distintos.'],['eye','Reportar imagen','Algo que no debería haber salido.']].map(([i,t,s])=>`<button class="row" data-act="dmenuPick" data-m="${t}">${ic(i,24)}<span class="grow">${t}<span class="sm">${s}</span></span></button>`).join('')}<button class="row" data-act="closeSheet" style="color:var(--red)">${ic('trash',24)}<span class="grow">Quitar</span></button>`);
A.dmenuPick=el=>{if(el.dataset.m==='No se parece')return sheet(`<h3>¿Qué falló?</h3>${['La prenda se ve distinta','El color se ve distinto','No se parece a mí','Falta una prenda','Se ve raro'].map(t=>`<button class="row" data-act="noParece"><span class="grow">${t}</span>${ic('chev',20)}</button>`).join('')}`);closeSheet();toast('En la app esto se abre aquí.')};
A.noParece=()=>{closeSheet();toast('Gracias. Volvemos a generar esa imagen.')};
A.save=()=>sheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px"><div class="ph" style="width:64px;aspect-ratio:2/3;border-radius:10px;background-image:${imgv(dImgKey())}"></div><div><b>Armario · ${esc(S.scenes[S.detail.si].title)}</b><div class="sm">Imagen 2:3 · Hecha con IA</div></div></div>
 <div class="chips" style="margin:10px 0 6px">${['Mensajes','WhatsApp','Correo','AirDrop'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
 <button class="row" data-act="saved">${ic('download',24)}<span class="grow">Guardar imagen</span></button><button class="row" data-act="closeSheet">${ic('chev',24)}<span class="grow">Copiar</span></button>
 <p class="sm" style="margin:6px 0 0">Así se abre la hoja de compartir del iPhone, para que la imagen quede en Fotos.</p>`);
A.saved=()=>{closeSheet();toast('Guardada en Fotos.')};
A.shareLook=()=>sheet(`<h3>Compartir enlace</h3><p class="sub" style="margin-top:0">Estos looks muestran tu cara. Cualquier persona con el enlace los puede ver.</p><button class="btn" data-act="shareGo">Compartir</button><button class="btn ghost" data-act="closeSheet">Cancelar</button>`);
A.shareGo=()=>{closeSheet();toast('Se abre la hoja de compartir con el enlace. Siempre podrás dejar de compartir.')};
function addMsg(r,t){S.detail.msgs.push({r,t})}
A.chip=el=>{if(el.dataset.v==='Cambiar una prenda')return A.dmenu();chatSay(el.dataset.v)};
A.chatSend=()=>{const i=$('#cin');if(!i||!i.value.trim())return;const v=i.value.trim();i.value='';chatSay(v)};
function chatSay(t){const d=S.detail;if(d.busy)return;addMsg('u',t);d.chips=null;
 const low=t.toLowerCase();let reply,make=false;
 if(TOG.offline)reply='Sin conexión. Escríbeme cuando vuelva.';
 else if(/horizontal|cuadrad|panor/.test(low))reply='Todas las fotos salen en vertical, estilo Pinterest. Puedo acercar o alejar el encuadre.';
 else if(/vestido|camisa|pantal|falda|playera|blazer|zapat|ropa|chamarra|sueter|suéter|cara|cuerpo|pelo|cabello/.test(low)){reply='La ropa y tu foto se quedan igual; aquí cambio solo el lugar y el ambiente. Si quieres otra prenda, elígela del armario.';d.chips=['Cambiar una prenda','Hazlo de noche','Más luz']}
 else if(/desnud|sexual|violen/.test(low))reply='Eso no lo puedo crear. Cuéntame otra escena.';
 else if(/(bonit|mejor|algo|chido|padre)/.test(low)&&low.split(/\s+/).length<4){reply='¿Más bonito cómo? ¿Más luz, otro lugar o un encuadre distinto?';d.chips=['Más luz','Otro lugar','Más cerca']}
 else if(d.made>=1)reply='En este prototipo solo preparé una versión de ejemplo. En la app, cada cambio crea una imagen nueva (hasta 10 por look).';
 else make=true;
 if(!make){setTimeout(()=>{addMsg('a',reply);render()},350);render();return}
 d.busy=true;render();
 setTimeout(()=>{d.busy=false;d.made++;d.vers.push({key:d.cid+'_noche',label:'Versión '+(d.vers.length+1)});d.vIdx=d.vers.length-1;
  addMsg('a',/noche|lluv/.test(low)?'Listo: la misma escena, de noche y con lluvia. Creé una versión nueva.':'Listo, creé una versión nueva. <span class="sm">(En este prototipo la versión de ejemplo siempre es de noche y con lluvia.)</span>');
  d.chips=['Más cerca','Otro lugar','Más luz','Usar esta escena en todos mis conjuntos'];render()},2000)}
A.yoFoto=()=>{if(!S.hasPhoto){S.photoState='none';S.itsMe=false;S.fromTab=false;return go('foto')}sheet(`<h3>Tu foto</h3><div class="ph" style="width:110px;aspect-ratio:2/3;border-radius:14px;background-image:${imgv('base')};margin-bottom:10px"></div><button class="row" data-act="closeSheet">${ic('camera',22)}<span class="grow">Cambiar foto</span></button><button class="row" data-act="closeSheet" style="color:var(--red)">${ic('trash',22)}<span class="grow">Borrar mi foto</span></button>`)};
A.yoPal=()=>{if(!S.hasPhoto){S.photoState='none';S.itsMe=false;S.fromTab=false;return go('foto')}
 if(!S.hasPalette){S.palState='analyzing';go('paleta');return setTimeout(()=>{if(S.screen==='paleta'){S.palState='done';render()}},1700)}S.palState='done';go('paleta')};
A.yoPriv=()=>sheet(`<h3>Ajustes y privacidad</h3>${['Borrar mi foto','Borrar mis looks','Borrar todas mis fotos de ropa','Descargar mis datos','Agregar a mi pantalla de inicio','Ver las pistas otra vez','Borrar mi cuenta'].map(t=>`<button class="row" data-act="yoPrivPick" data-m="${t}"><span class="grow" style="${t==='Borrar mi cuenta'?'color:var(--red)':''}">${t}</span></button>`).join('')}`);
A.yoPrivPick=el=>{closeSheet();if(el.dataset.m==='Ver las pistas otra vez'){S.coachSeen=false;S.coachDetailSeen=false;toast('Listo, las pistas volverán a salir.')}else if(el.dataset.m==='Agregar a mi pantalla de inicio')setTimeout(A.howInstall,260);else toast('En la app esto pide confirmación y borra de verdad.')};
A.tog=el=>{TOG[el.dataset.k]=el.checked;document.querySelectorAll('[data-act=tog][data-k="'+el.dataset.k+'"]').forEach(x=>x.checked=el.checked);app.classList.toggle('off',TOG.offline);render()};
A.reset=()=>doReset();
function doReset(){timers.splice(0).forEach(clearTimeout);clearInterval(upTimer);S=fresh();closeSheet();render()}
function prep(o={}){timers.splice(0).forEach(clearTimeout);clearInterval(upTimer);S=fresh();closeSheet();
 if(o.added){S.added=true}if(o.photo){S.hasPhoto=true;S.itsMe=true;S.photoState='ok'}if(o.pal){S.hasPalette=true;S.palState='done'}}
A.jump=el=>{const t=el.dataset.to;
 const J={intro0:()=>{prep();S.introIdx=0;go('intro',{replace:true})},intro1:()=>{prep();S.introIdx=1;go('intro',{replace:true})},intro2:()=>{prep();S.introIdx=2;go('intro',{replace:true})},
  cuenta:()=>{prep();go('cuenta',{replace:true})},primeras:()=>{prep();go('primeras',{replace:true})},camara:()=>{prep();S.camShots=0;go('camara',{replace:true})},
  reconoce:()=>{prep();go('subiendo',{replace:true});startUpload()},revisar:()=>{prep({added:true});go('revisar',{replace:true})},armario0:()=>{prep({added:true});S.checklist=true;go('armario',{replace:true})},
  foto:()=>{prep({added:true});S.vestOK=true;S.fromTab=true;go('foto',{replace:true})},paleta:()=>{prep({added:true,photo:true});S.vestOK=true;S.palState='analyzing';go('paleta',{replace:true});setTimeout(()=>{if(S.screen==='paleta'){S.palState='done';render()}},1700)},
  armar1:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;go('armar1',{replace:true})},armar2:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;S.conjs=['c1','c2'];go('armar2',{replace:true})},
  gen:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;S.conjs=['c1','c2'];startGen();go('looks',{replace:true})},
  looks:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;readyAll();go('looks',{replace:true})},
  detalle:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;readyAll();S.coachSeen=true;A.open({dataset:{k:'c1:0'}});S.coachDetail=false;render()},
  chat:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;readyAll();S.coachSeen=true;A.open({dataset:{k:'c1:0'}});S.coachDetail=false;S.detail.chat=true;render()},
  yo:()=>{prep({added:true,photo:true,pal:true});S.vestOK=true;go('yo',{replace:true})}};
 closeSheet();J[t]&&J[t]()};

/* ---------- eventos ---------- */
let lpT=null,lpFired=false,sx=0,sy=0,sEl=null;
document.addEventListener('click',e=>{if(lpFired){lpFired=false;e.preventDefault();return}
 const el=e.target.closest('[data-act]');if(!el||el.tagName==='FORM')return;const f=A[el.dataset.act];if(f){if(el.type==='checkbox'){f(el,e);return}if(el.dataset.act==='chatSend'&&el.tagName==='FORM')return;f(el,e)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-act="tog"]');if(el)A.tog(el)});
document.addEventListener('submit',e=>{if(e.target.dataset.act==='chatSend'){e.preventDefault();A.chatSend()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind){S[t.dataset.bind]=t.value;if(t.dataset.bind==='q')render(),(()=>{const q=$('#q');q&&(q.focus(),q.setSelectionRange(q.value.length,q.value.length))})()}
 if(t.dataset.scene!==undefined){const i=+t.dataset.scene,v=t.value,first=v.trim().split(/\s+/).slice(0,3).join(' ');S.scenes[i]={text:v,title:v.trim()?(S.scenes[i].title&&v===S.scenes[i].text?S.scenes[i].title:first.charAt(0).toUpperCase()+first.slice(1)):'Estudio liso'};
  $('#cnt'+i).textContent=v.length+'/280';const w=sceneWarn(v),we=$('#w'+i);we.style.display=w?'':'none';we.querySelector('span').textContent=w}});
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.scene!==undefined)S.focusScene=+e.target.dataset.scene});
screenEl.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sEl=e.target.closest('[data-swipe]');const lp=e.target.closest('[data-lp]');
 if(lp&&S.screen==='armario'&&!S.selMode){lpT=setTimeout(()=>{lpFired=true;A.lp(lp.dataset.lp)},480)}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>screenEl.addEventListener(ev,e=>{clearTimeout(lpT);
 if(ev==='pointerup'&&sEl){const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){const f=A[sEl.dataset.swipe];f&&f(dx<0?1:-1);lpFired=false}}sEl=null}));
screenEl.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)clearTimeout(lpT)});

/* ---------- marco y arranque ---------- */
function fit(){const mobile=innerWidth<=520;document.body.classList.toggle('mobile',mobile);const dev=$('#device'),w=$('#dwrap');
 if(mobile){dev.style.transform='';w.style.width='';w.style.height='';return}
 const s=Math.min(1,(innerHeight-24)/894);dev.style.transform=`scale(${s})`;w.style.width=422*s+'px';w.style.height=894*s+'px';
 $('#side').style.display=innerWidth<860?'none':''}
addEventListener('resize',()=>{fit();if(S.screen==='detalle'&&S.detail&&S.detail.chat)layoutChat()});
$('#side').innerHTML=`<h1>Armario</h1><p>Prototipo de web móvil a 402 × 874 pt. Fotos y datos de ejemplo: no es la app.</p>${protoPanel()}`;
fit();render();
</script>
